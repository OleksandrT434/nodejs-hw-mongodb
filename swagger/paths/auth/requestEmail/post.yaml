tags:
  - Auth
summary: Request email
operationId: requestEmail
description: The ability to send a new password reset token to your email
security:
  - {}
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            type: string
            format: email
            description: User's email address
            example: qwerty12@gmail.com
responses:
  200:
    description: Password reset email sent successfully!
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code.
              example: 200
            message:
              type: string
              description: Success message.
              example: Password reset email sent successfully!
  401:
    $ref: ../../../components/responses/401.yaml
  500:
    $ref: ../../../components/responses/500.yaml
